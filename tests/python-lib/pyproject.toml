[project]
name = "python-lib"
version = "0.0.0"
description = "My sample Python library"
readme = "README.md"
authors = [{ name = "Gianluca Costa", email = "gianluca@gianlucacosta.info" }]

dependencies = ["info-gianlucacosta-eos-core==2.0.2"]

[build-system]
requires = ["hatchling"]
