name: Replace regex pattern
description: Replaces the given regex with the given replacement in all the requested file patterns.

inputs:
  files:
    description: Comma-separated file patterns.
    default: "**"

  regex:
    description: The Perl regular expression pattern.

  replacement:
    description: The replacement string - supporting $X groups.

  working-directory:
    description: The directory where the action should run.
    default: .

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/setup-elvish-context@v11.0.0

    - shell: elvish {0}
      working-directory: ${{ inputs.working-directory }}
      run: |
        use github.com/giancosta86/aurora-github/actions/replace-regex-pattern
        replace-regex-pattern:main
      env:
        files: ${{ inputs.files }}
        regex: ${{ inputs.regex }}
        replacement: ${{ inputs.replacement }}
