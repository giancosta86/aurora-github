name: Inject subpath exports
description: Appends subpath exports to package.json according to the directory tree.

inputs:
  mode:
    description: Subpath exports generation mode; can be "prefer-index" or "all".
    default: prefer-index

  source-directory:
    description: Relative path to the source directory.
    default: src

  project-directory:
    description: The directory containing package.json.
    default: .

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/setup-elvish-context@v10.3.0

    - shell: elvish {0}
      working-directory: ${{ inputs.project-directory }}
      run: |
        use aurora-github/input
        use aurora-github/nodejs/subpath-exports

        subpath-exports:inject [
          &source-directory=(input:require source-directory '${{ inputs.source-directory }}')
          &mode=(input:require mode '${{ inputs.mode }}')
        ]
