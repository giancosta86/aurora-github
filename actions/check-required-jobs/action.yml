name: Check required jobs
description: Verifies that all the jobs in the `needs:` directive of the current job have completed successfully.

inputs:
  needs-as-json:
    description: Always pass the evaluation of `toJSON(needs)`.

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/setup-elvish-context@v11.0.0

    - name: Check the required jobs
      shell: elvish {0}
      run: |
        use aurora-github/ci-cd/input
        use aurora-github/ci-cd/required-jobs

        var needs-as-json = (input:string needs-as-json '${{ inputs.needs-as-json }}')

        required-jobs:check $needs-as-json
