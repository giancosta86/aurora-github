name: Setup a NodeJS context
description: Conditionally installs NodeJS along with `pnpm`, as well as the dependencies listed in package.json.

inputs:
  install-arguments:
    description: Additional arguments to pass to the `install` command.

  working-directory:
    description: The directory containing package.json.
    default: .

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/setup-elvish-context@v11.0.0

    - uses: giancosta86/aurora-github/actions/install-elvish-packages@v11.0.0
      with:
        packages: github.com/giancosta86/astral-bridge@v1

    - shell: elvish {0}
      working-directory: ${{ inputs.working-directory }}
      run: |
        use github.com/giancosta86/aurora-github/actions/setup-nodejs-context
        setup-nodejs-context:main
