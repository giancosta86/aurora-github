name: Setup JVM context
description: Installs and configures a Java Virtual Machine environment using SDKMAN.

inputs:
  working-directory:
    description: Directory containing the .sdkmanrc file.
    default: .

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/init-aurora-github@v13.0.0

    - uses: giancosta86/aurora-github/actions/setup-sdkman-context@v13.0.0
      with:
        working-directory: ${{ inputs.working-directory }}

    - shell: elvish {0}
      working-directory: ${{ inputs.working-directory }}
      run: |
        use github.com/giancosta86/aurora-github/actions/setup-jvm-context
        setup-jvm-context:main
