name: Publish Rust crate
description: Publishes a Rust crate - by default, to crates.io - with all of its features enabled.

inputs:
  dry-run:
    description: Run a simulated publication via --dry-run.
    default: false

  cargo-token:
    description: The secret token for publishing to the registry.

  document-all-features:
    description: Enable Rustdoc for all features.
    default: true

  website-directory:
    description: Relative directory containing the project website.
    default: website

  enforce-branch-version:
    description: How the branch version should be enforced.
    default: inject

  project-directory:
    description: The directory containing Cargo.toml.
    default: .

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/setup-elvish-context@v10.3.0

    - name: Validate inputs
      shell: elvish {0}
      working-directory: ${{ inputs.project-directory }}
      run: |
        use aurora-github/input

        var dry-run = (input:require-bool dry-run '${{ inputs.dry-run }}')

        if (not $dry-run) {
          input:require cargo-token '${{ inputs.cargo-token }}'
        }

        input:require document-all-features '${{ inputs.document-all-features }}'

        input:require website-directory '${{ inputs.website-directory }}'

        input:require enforce-branch-version '${{ inputs.enforce-branch-version }}'

    - name: Enforce branch version
      uses: giancosta86/aurora-github/actions/enforce-branch-version@v10.3.0
      with:
        mode: ${{ inputs.enforce-branch-version }}
        project-directory: ${{ inputs.project-directory }}

    - name: Setup Rust context
      uses: giancosta86/aurora-github/actions/setup-rust-context@v10.3.0
      with:
        project-directory: ${{ inputs.project-directory }}

    - name: Document all features
      if: inputs.document-all-features == 'true'
      shell: elvish {0}
      working-directory: ${{ inputs.project-directory }}
      run: |
        use aurora-github/rust/code

        code:document-all-features

    - name: Publish the GitHub Pages website
      uses: giancosta86/aurora-github/actions/publish-github-pages@v10.3.0
      with:
        optional: true
        source-directory: ${{ inputs.project-directory }}/${{ inputs.website-directory }}
        dry-run: ${{ inputs.dry-run }}
        enforce-branch-version: ${{ inputs.enforce-branch-version }}

    - name: Print project descriptor
      shell: elvish {0}
      working-directory: ${{ inputs.project-directory }}
      run: |
        use aurora-github/console

        console:section &emoji=🦀 'Cargo.toml just before publication' {
          cat Cargo.toml
        }

    - name: Publish the crate
      shell: elvish {0}
      working-directory: ${{ inputs.project-directory }}
      run: |
        use aurora-github/input
        use aurora-github/lang

        var dry-run = (input:require-bool dry-run '${{ inputs.dry-run }}')

        var dry-run-arg = (lang:ternary $dry-run [--dry-run] [])

        cargo publish --all-features --allow-dirty $@dry-run-arg
      env:
        CARGO_REGISTRY_TOKEN: ${{ inputs.cargo-token }}

    - name: Print confirmation message
      shell: elvish {0}
      run: echo ✅🦀Rust crate publication step successful!
