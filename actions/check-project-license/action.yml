name: Check project license
description: Checks the validity of the project license file.

inputs:
  license-file:
    description: Path to the license file.
    default: LICENSE

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/init-aurora-github@v11.0.1

    - shell: elvish {0}
      run: |
        use github.com/giancosta86/aurora-github/actions/check-project-license
        check-project-license:main
      env:
        license-file: ${{ inputs.license-file }}
