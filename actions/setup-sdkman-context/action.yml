name: Setup SDKMAN context
description: Installs a set of SDKs using SDKMAN.

inputs:
  working-directory:
    description: Directory containing the .sdkmanrc file.
    default: .

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/init-aurora-github@v13.0.0

    - shell: elvish {0}
      working-directory: ${{ inputs.working-directory }}
      run: |
        use github.com/giancosta86/aurora-github/actions/setup-sdkman-context
        setup-sdkman-context:main
