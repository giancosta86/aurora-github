name: Verify JVM project
description: Verifies the source files of a project for the Java Virtual Machine - using Maven or Gradle.

inputs:
  java-version:
    description: Java version (in SDKMAN) to install.

  tool-version:
    description: Build tool version (in SDKMAN) to install.

  quiet-tool:
    description: Run the build tool in quiet mode
    default: true

  crash-on-critical-todos:
    description: Crash the workflow if critical TODOs are found.
    default: true

  source-file-regex:
    description: PCRE pattern describing the source files.
    default: '^\.\/src\/.+\.(java|kt|scala|groovy)$'

  enforce-branch-version:
    description: How the branch version should be enforced.
    default: inject

  project-directory:
    description: The directory containing the project descriptor.
    default: .

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/setup-elvish-context@v10.3.0

    - name: Validate inputs
      shell: elvish {0}
      working-directory: ${{ inputs.project-directory }}
      run: |
        use aurora-github/input

        input:require quiet-tool '${{ inputs.quiet-tool }}'

        input:require crash-on-critical-todos '${{ inputs.crash-on-critical-todos }}'

        input:require source-file-regex '${{ inputs.source-file-regex }}'

        input:require enforce-branch-version '${{ inputs.enforce-branch-version }}'

    - name: Check the project license
      uses: giancosta86/aurora-github/actions/check-project-license@v10.3.0

    - name: Detect the build tool
      shell: elvish {0}
      run: |
        use aurora-github/env
        use aurora-github/jvm/project

        var build-tool = (project:detect '${{ inputs.project-directory }}')[build-tool]

        env:write buildTool $build-tool

    - name: Enforce branch version
      uses: giancosta86/aurora-github/actions/enforce-branch-version@v10.3.0
      with:
        mode: ${{ inputs.enforce-branch-version }}
        project-directory: ${{ inputs.project-directory }}

    - name: Install Java
      if: inputs.java-version != ''
      uses: giancosta86/aurora-github/actions/install-via-sdkman@v10.3.0
      with:
        candidate: java
        version: ${{ inputs.java-version }}

    - name: Install Maven
      if: env.buildTool == 'mvn' && inputs.tool-version != ''
      uses: giancosta86/aurora-github/actions/install-via-sdkman@v10.3.0
      with:
        candidate: maven
        version: ${{ inputs.tool-version }}

    - name: Install Gradle
      if: env.buildTool == 'gradle' && inputs.tool-version != ''
      uses: giancosta86/aurora-github/actions/install-via-sdkman@v10.3.0
      with:
        candidate: gradle
        version: ${{ inputs.tool-version }}

    - name: Run Maven
      if: env.buildTool == 'mvn'
      shell: elvish {0}
      working-directory: ${{ inputs.project-directory }}
      run: |
        use aurora-github/input
        use aurora-github/jvm/maven

        var quiet = (input:require-bool quiet-tool '${{ inputs.quiet-tool }}')

        echo 🪶Running Maven to verify the project...

        maven:run &quiet=$quiet verify

    - name: Run Gradle
      if: env.buildTool == 'gradle'
      shell: elvish {0}
      working-directory: ${{ inputs.project-directory }}
      run: |
        use aurora-github/input
        use aurora-github/jvm/gradle

        var quiet = (input:require-bool quiet-tool '${{ inputs.quiet-tool }}')

        echo 🐘Running Gradle to verify the project...

        gradle:run &quiet=$quiet build

    - name: Check for critical TODOs
      uses: giancosta86/aurora-github/actions/find-critical-todos@v10.3.0
      with:
        source-file-regex: ${{ inputs.source-file-regex }}
        crash-on-found: ${{ inputs.crash-on-critical-todos }}
        display-lines: true
        root-directory: ${{ inputs.project-directory }}

    - name: Print confirmation message
      shell: elvish {0}
      run: echo ✅JVM project verified!
