name: Verify npm package
description: Verifies the source files of a NodeJS package.

inputs:
  todo-files:
    description: File patterns potentially containing critical TODOs.
    default: "**[nomatch-ok].{js jsx ts tsx}"

  check-subpath-exports:
    description: Run check-subpath-exports after the `verify` package script.
    default: true

  working-directory:
    description: The directory containing `package.json`.
    default: .

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/setup-elvish-context@v11.0.0

    - uses: giancosta86/aurora-github/actions/check-project-license@v11.0.0

    - uses: giancosta86/aurora-github/actions/inject-branch-version@v11.0.0
      with:
        files: package.json
        working-directory: ${{ inputs.working-directory }}

    - uses: giancosta86/aurora-github/actions/setup-nodejs-context@v11.0.0
      with:
        working-directory: ${{ inputs.working-directory }}

    - shell: elvish {0}
      working-directory: ${{ inputs.working-directory }}
      run: |
        use github.com/giancosta86/aurora-github/actions/verify-npm-package
        verify-npm-package:main

    - if: inputs.check-subpath-exports == 'true'
      uses: giancosta86/aurora-github/actions/check-subpath-exports@v11.0.0
      with:
        working-directory: ${{ inputs.working-directory }}

    - uses: giancosta86/aurora-github/actions/find-critical-todos@v11.0.0
      with:
        files: ${{ inputs.todo-files }}
        working-directory: ${{ inputs.working-directory }}

    - name: Print confirmation message
      shell: elvish {0}
      run: echo ✅📦 npm package project verified!
