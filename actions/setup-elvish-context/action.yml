name: Setup an Elvish context
description: Installs the Elvish shell and a set of core libraries.

inputs:
  version:
    description: The Elvish version to install.
    default: 0.21.0

  ethereal-version:
    description: The Ethereal version to install - or empty string to skip.
    default: v1

runs:
  using: composite
  steps:
    - name: Install Elvish
      shell: bash
      run: |
        source "${{ github.action_path }}/../bootstrap.sh"

        if ! commandExists elvish
        then
          installElvish '${{ inputs.version }}'
        fi

    - name: Link the aurora-github core as an Elvish package
      shell: bash
      working-directory: ${{ github.action_path }}/../../core/actions
      run: |
        elvish -c 'use ./setup-elvish-context; setup-elvish-context:link-aurora-github-core'

    - name: Install Ethereal
      if: inputs.ethereal-version != ''
      uses: giancosta86/aurora-github/actions/install-elvish-packages@v11.0.0
      with:
        packages: github.com/giancosta86/ethereal@${{ inputs.ethereal-version }}
