name: Setup an Elvish context
description: Installs the Elvish shell and a set of core libraries.

inputs:
  version:
    description: The Elvish version to install.
    default: 0.21.0

  ethereal-version:
    description: The Ethereal version to install - or empty string to skip.
    default: v1

runs:
  using: composite
  steps:
    - name: Setup Elvish
      shell: bash
      run: |
        source "${{ github.action_path }}/bootstrap.sh"

        ensureElvish '${{ inputs.version }}'

    - name: Install epm-plus
      shell: elvish {0}
      run: |
        use epm

        var epm-plus-library = github.com/giancosta86/epm-plus

        if (not (epm:is-installed $epm-plus-library)) {
          epm:install $epm-plus-library
        }

    - name: Link the aurora-github core as an Elvish package
      shell: elvish {0}
      working-directory: ${{ github.action_path }}/../../core/actions
      run: |
        use epm
        use os
        use path

        var action-path = (get-env GITHUB_ACTION_PATH)

        var link-path = (
          path:join $epm:managed-dir github.com giancosta86 aurora-github
        )

        if (not (os:exists $link-path)) {
          path:dir $link-path |
            os:mkdir-all (all)

          var aurora-github-core-directory = (
            path:join $action-path .. .. core
          )

          os:symlink $aurora-github-core-directory $link-path
        }

    - name: Install Ethereal
      if: inputs.ethereal-version != ''
      shell: elvish {0}
      run: |
        use github.com/giancosta86/aurora-github/epm-plus

        epm-plus:install github.com/giancosta86/ethereal@${{ inputs.ethereal-version }}
