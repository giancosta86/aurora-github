name: Setup an Elvish context
description: Installs the Elvish shell and a set of core libraries.

inputs:
  version:
    description: The Elvish version to install.
    default: 0.21.0

  ethereal-version:
    description: The Ethereal version to install - or empty string to skip.
    default: v1

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        source "bootstrap.sh"
        ensureElvish '${{ inputs.version }}'

    - shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        elvish bootstrap.elv
      env:
        ethereal-version: ${{ inputs.ethereal-version }}
