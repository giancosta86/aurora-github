name: Check GitHub Actions references
description: Prevents cross-branch `uses:` directives between GitHub actions residing below the same root directory.

inputs:
  actions-directory:
    description: The root of the directory tree containing the actions.
    default: actions

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/setup-elvish-context@v11.0.0

    - shell: elvish {0}
      working-directory: ${{ inputs.actions-directory }}
      run: |
        use aurora-github/action-references
        use aurora-github/ci-cd/input

        action-references:check
