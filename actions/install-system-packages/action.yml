name: Install system packages
description: Installs software using the platform's package manager.

inputs:
  required-command:
    description: When declared, the packages are installed only if the command is missing.

  packages:
    description: The packages to install, separated by any spaces or commas.

  initial-update:
    description: Update the package list before the first installation.
    default: true

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/setup-elvish-context@v10.3.0

    - shell: elvish {0}
      run: |
        use aurora-github/input
        use aurora-github/system-packages

        var inputs = [
          &packages=(input:list '${{ inputs.packages }}')
          &required-command=(input:optional '${{ inputs.required-command }}')
          &initial-update=(input:require initial-update '${{ inputs.initial-update}}')
        ]

        system-packages:install $inputs
