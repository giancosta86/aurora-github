name: Tag and release
description: Merges a pull request, creates a Git tag and publishes a GitHub release, from a Git branch named according to semantic versioning.

inputs:
  draft-release:
    description: Draft the release - do not publish it.
    default: false

  notes-file-processor:
    description: Bash script editing the generated release notes.

  set-major-tag:
    description: Create/move the 'vX' tag to this commit (X=major version).
    default: false

  dry-run:
    description: Run the action without performing commands.
    default: false

  git-strategy:
    description: How to apply the pull request to the Git repository. Can be `merge`, `rebase` or `squash`.
    default: rebase

outputs:
  release-tag:
    description: The Git tag associated with the release.
    value: ${{ steps.action-body.outputs.tag }}

  major-tag:
    description: The Git tag of the major version, if set.
    value: ${{ steps.action-body.outputs.major-tag }}

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/setup-elvish-context@v10.3.0

    - id: action-body
      shell: elvish {0}
      run: |
        use path
        use aurora-github/console
        use aurora-github/input
        use aurora-github/tag-and-release

        var inputs = [
          &draft-release=(input:require-bool draft-release '${{ inputs.draft-release }}')
          &set-major-tag=(input:require-bool set-major-tag '${{ inputs.set-major-tag }}')
          &dry-run=(input:require-bool dry-run '${{ inputs.dry-run }}')
          &git-strategy=(input:require-enum git-strategy '${{ inputs.git-strategy }}' [merge rebase squash])
          &notes-file-processor=(input:optional '${{ inputs.notes-file-processor }}')
          &github-repository=(get-env GITHUB_REPOSITORY)
        ]

        tag-and-release:run-action $inputs
      env:
        GH_TOKEN: ${{ github.token }}
