name: Publish npm package
description: Publishes a NodeJS package to an npm registry.

inputs:
  dry-run:
    description: Run a simulated publication via --dry-run.
    default: false

  npm-token:
    description: The secret token for publishing to the registry.

  website-directory:
    description: Relative directory containing the project website.
    default: website

  enforce-branch-version:
    description: How the branch version should be enforced.
    default: inject

  project-directory:
    description: The directory containing package.json.
    default: .

runs:
  using: composite
  steps:
    - uses: giancosta86/aurora-github/actions/setup-elvish-context@v10.3.0

    - name: Validate inputs
      shell: elvish {0}
      working-directory: ${{ inputs.project-directory }}
      run: |
        use os
        use aurora-github/input

        var dry-run = (input:require-bool dry-run '${{ inputs.dry-run }}')

        if (not $dry-run) {
          input:require npm-token '${{ inputs.npm-token }}'
        }

        input:require website-directory '${{ inputs.website-directory }}'

        input:require enforce-branch-version '${{ inputs.enforce-branch-version }}'

        if (not (os:is-regular package.json)) {
          fail "The package.json descriptor file does not exist!"
        }

    - name: Enforce branch version
      uses: giancosta86/aurora-github/actions/enforce-branch-version@v10.3.0
      with:
        mode: ${{ inputs.enforce-branch-version }}
        project-directory: ${{ inputs.project-directory }}

    - name: Setup NodeJS context
      uses: giancosta86/aurora-github/actions/setup-nodejs-context@v10.3.0
      with:
        project-directory: ${{ inputs.project-directory }}

    - name: Try to build the package artifacts
      shell: elvish {0}
      working-directory: ${{ inputs.project-directory }}
      run: |
        use aurora-github/nodejs/npm

        npm:run-optional-script build

    - name: Publish the GitHub Pages website
      uses: giancosta86/aurora-github/actions/publish-github-pages@v10.3.0
      with:
        optional: true
        source-directory: ${{ inputs.project-directory }}/${{ inputs.website-directory }}
        dry-run: ${{ inputs.dry-run }}
        enforce-branch-version: ${{ inputs.enforce-branch-version }}

    - name: Display the artifact descriptor
      shell: elvish {0}
      working-directory: ${{ inputs.project-directory }}
      run: |
        use aurora-github/console

        console:section &emoji=📦 'package.json just before publication' {
          jq -C . package.json
        }

    - name: Ensure the package manager configuration file exists
      shell: elvish {0}
      working-directory: ${{ inputs.project-directory }}
      run: |
        use aurora-github/nodejs/npm

        npm:ensure-config

    - name: Publish to the registry
      shell: elvish {0}
      working-directory: ${{ inputs.project-directory }}
      run: |
        use aurora-github/lang
        use aurora-github/input

        var dry-run = (input:require-bool dry-run '${{ inputs.dry-run }}')

        var dry-run-arg = (lang:ternary $dry-run [--dry-run] [])

        pnpm publish --no-git-checks --access public $@dry-run-arg
      env:
        NPM_TOKEN: ${{ inputs.npm-token }}

    - name: Print confirmation message
      shell: elvish {0}
      run: echo ✅📦Npm package publication step successful!
