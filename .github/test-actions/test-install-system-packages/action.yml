name: Test install-system-packages
description: Tests for install-system-packages.

runs:
  using: composite
  steps:
    - uses: ./actions/setup-elvish-context

    - name: Setup environment variables
      shell: elvish {0}
      run: |
        use github.com/giancosta86/aurora-github/ci-cd/env

        env:write expected-command sponge

    - uses: ./actions/run-velvet-code
      with:
        code: |
          use os

          >> 'The expected command' {
            >> 'should not pre-exist' {
              put ?(which (get-env expected-command) > $os:dev-null 2>&1) |
                should-not-be $ok
            }
          }

    - name: Running unconditional installation
      uses: ./actions/install-system-packages
      with:
        packages: jq, moreutils

    - uses: ./actions/run-velvet-code
      with:
        code: |
          >> 'The expected command' {
            >> 'should now be available' {
              use os

              put ?(which (get-env expected-command) > $os:dev-null 2>&1) |
                should-be $ok
            }
          }

    - shell: elvish {0}
      run: echo "🎭 Running conditional installation for existing command - which should be skipped..."

    - uses: ./actions/install-system-packages
      with:
        required-command: sponge
        packages: moreutils
