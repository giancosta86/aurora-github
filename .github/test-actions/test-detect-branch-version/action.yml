name: Test detect-branch-version
description: Tests for detect-branch-version.

runs:
  using: composite
  steps:
    - id: detect-branch-version
      uses: ./actions/detect-branch-version

    - uses: ./actions/run-elvish-tests
      with:
        working-directory: ${{ github.action_path }}
      env:
        branch: ${{ steps.detect-branch-version.outputs.branch }}
        version: ${{ steps.detect-branch-version.outputs.version }}
        escaped-version: ${{ steps.detect-branch-version.outputs.escaped-version }}
        major: ${{ steps.detect-branch-version.outputs.major }}
