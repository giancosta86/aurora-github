name: Test setup-rust-context
description: Tests for setup-rust-context.

runs:
  using: composite
  steps:
    - uses: ./actions/setup-elvish-context

    - shell: elvish {0}
      run: echo 🎭 Testing on Rust crate...

    - name: Run for Rust crate project
      uses: ./actions/setup-rust-context
      with:
        working-directory: tests/rust-crate

    - shell: elvish {0}
      run: echo 🎭 Testing on Rust Wasm...

    - name: Run for Rust web assembly project
      uses: ./actions/setup-rust-context
      with:
        working-directory: tests/rust-wasm

    - shell: elvish {0}
      run: echo ✅ All tests OK!
