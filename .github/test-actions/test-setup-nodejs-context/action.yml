name: Test setup-nodejs-context
description: Tests for setup-nodejs-context.

runs:
  using: composite
  steps:
    - uses: giancosta86/gauntlet/actions/setup-elvish-action@v1

    - shell: bash
      working-directory: ${{ github.action_path }}
      run: elvish setup.elv

    - shell: elvish {0}
      run: echo 🎭 Testing preconditions...

    - uses: ./actions/run-elvish-tests
      with:
        working-directory: ${{ github.action_path }}
        velvet-scripts: preconditions

    - uses: ./actions/setup-nodejs-context
      with:
        working-directory: tests/npm-package

    - shell: elvish {0}
      run: echo 🎭 Testing action side-effects...

    - uses: ./actions/run-elvish-tests
      with:
        working-directory: ${{ github.action_path }}
        velvet-scripts: action

    - shell: elvish {0}
      run: echo ✅ All tests OK!
