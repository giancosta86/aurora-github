name: Test check-subpath-exports
description: Tests for check-subpath-exports.

runs:
  using: composite
  steps:
    - uses: ./actions/init-aurora-github

    - uses: ./.github/test-actions/test-check-subpath-exports/scenario
      with:
        header: When the "exports" field is missing...
        jq-operation: del(.exports)

    - uses: ./.github/test-actions/test-check-subpath-exports/scenario
      with:
        header: When the "exports" field is present but empty...
        jq-operation: .exports={}

    - uses: ./.github/test-actions/test-check-subpath-exports/scenario
      with:
        header: When the "exports" field is a string...
        jq-operation: .exports="./src/beta/index.js"

    - uses: ./.github/test-actions/test-check-subpath-exports/scenario
      with:
        header: When the "exports" object contains a string field...
        jq-operation: |
          .exports={
            "beta": "./src/beta/index.js"
          }

    - uses: ./.github/test-actions/test-check-subpath-exports/scenario
      with:
        header: When the "exports" object contains an object field...
        jq-operation: |
          .exports={
              "beta": {
                "import": "./src/beta/index.d.ts",
                "default": "./src/beta/index.js"
              }
            }

    - uses: ./.github/test-actions/test-check-subpath-exports/scenario
      with:
        header: When the "exports" object contains multiple fields...
        jq-operation: |
          .exports={
              "alpha": {
                "types": "./src/alpha/index.d.ts",
                "default": "./src/alpha/index.js"
              },

              "beta": {
                "types": "./src/beta/index.d.ts",
                "default": "./src/beta/index.js"
              },

              "omega": "./src/omega/index.js"
            }

    - uses: ./.github/test-actions/test-check-subpath-exports/scenario
      with:
        header: When wildcards are used...
        jq-operation: |
          .exports={
            "alpha/*.js": "./src/alpha/*.js"
          }

    - shell: elvish {0}
      run: echo ✅ All tests OK!
