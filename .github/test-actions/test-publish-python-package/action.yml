name: Test publish-python-package
description: Tests for publich-python-package.

inputs:
  index-secret:
    description: Password/token for publishing to the index.

runs:
  using: composite
  steps:
    - uses: ./actions/publish-python-package
      with:
        working-directory: tests/python-lib

        dry-run: true

        pdm-version: 2.28.2

        index-url: https://repo.repsy.io/giancosta86/pyground

        index-user: gian-token

        index-secret: ${{ inputs.index-secret }}
