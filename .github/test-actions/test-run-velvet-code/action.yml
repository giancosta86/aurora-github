name: Test run-velvet-code
description: Tests for run-velvet-code.

runs:
  using: composite
  steps:
    - uses: ./actions/setup-elvish-context

    - shell: elvish {0}
      run: echo 🎭 Running a basic test suite...

    - uses: ./actions/run-velvet-code
      with:
        code: |
          >> 'Basic test' {
            echo Hello, world!

            + 90 8 |
              should-be 98
          }

          >> 'The current directory' {
            >> 'should be the default one' {
              put $pwd |
                should-have-suffix aurora-github
            }
          }

    - shell: elvish {0}
      run: echo 🎭 Testing a custom working-directory...

    - uses: ./actions/run-velvet-code
      with:
        working-directory: /usr/local
        code: |
          >> 'The current working directory' {
            >> 'should be the requested one' {
              put $pwd |
                should-be /usr/local
            }
          }
