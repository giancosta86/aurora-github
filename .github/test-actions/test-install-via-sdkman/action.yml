name: Test install-via-sdkman
description: Tests for install-via-sdk-man.

runs:
  using: composite
  steps:
    - uses: ./actions/setup-elvish-context

    - name: Setup environment variables
      shell: elvish {0}
      run: |
        use github.com/giancosta86/aurora-github/ci-cd/env
        env:map [
          &expected-maven-version=3.8.7
          &expected-gradle-version=8.2.1
        ]

    - shell: elvish {0}
      run: echo "🎭 Checking the test environment..."

    - name: Ensuring preconditions
      uses: ./actions/run-velvet-code
      with:
        code: |
          >> 'The expected Maven version' {
            >> 'should not be installed' {
              mvn --version |
                should-not-contain (get-env expected-maven-version)
            }
          }

          >> 'The expected Gradle version' {
            >> 'should not be installed' {
              gradle --version |
                should-not-contain (get-env expected-gradle-version)
            }
          }

    - shell: elvish {0}
      run: echo "🎭 Installing 🪶 Maven..."

    - uses: ./actions/install-via-sdkman
      with:
        candidate: maven
        version: ${{ env.expected-maven-version }}

    - shell: bash
      run: echo "🎭 Installing 🐘 Gradle..."

    - uses: ./actions/install-via-sdkman
      with:
        candidate: gradle
        version: ${{ env.expected-gradle-version }}

    - name: Testing the results
      uses: ./actions/run-velvet-code
      with:
        code: |
          >> 'The expected Maven version' {
            >> 'should be installed' {
              mvn --version |
                should-contain (get-env expected-maven-version)
            }
          }

          >> 'The expected Gradle version' {
            >> 'should be installed' {
              gradle --version |
                should-contain (get-env expected-gradle-version)
            }
          }
