name: Test install-via-sdkman
description: Tests for install-via-sdk-man.

runs:
  using: composite
  steps:
    - uses: giancosta86/gauntlet/actions/setup-elvish-action@v1

    - shell: elvish {0}
      run: |
        use github.com/giancosta86/gauntlet/v1/env

        env:map [
          &expected-maven-version=3.8.7
          &expected-gradle-version=8.2.1
        ]

    - shell: elvish {0}
      run: echo 🎭 Checking the test environment...

    - uses: ./actions/run-elvish-tests
      with:
        working-directory: ${{ github.action_path }}
        velvet-scripts: preconditions

    - shell: elvish {0}
      run: echo 🎭 Installing 🪶 Maven...

    - uses: ./actions/install-via-sdkman
      with:
        candidate: maven
        version: ${{ env.expected-maven-version }}

    - shell: bash
      run: echo 🎭 Installing 🐘 Gradle...

    - uses: ./actions/install-via-sdkman
      with:
        candidate: gradle
        version: ${{ env.expected-gradle-version }}

    - uses: ./actions/run-elvish-tests
      with:
        working-directory: ${{ github.action_path }}
        velvet-scripts: action
