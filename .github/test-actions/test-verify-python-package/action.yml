name: Test verify-python-package
description: Tests for verify-python-package.

runs:
  using: composite
  steps:
    - uses: ./actions/init-aurora-github

    - shell: elvish {0}
      run: echo 🎭 Running for the first time...

    - uses: ./actions/verify-python-package
      with:
        working-directory: tests/python-lib
        pdm-version: 2.28.0
        check-license: false

    - shell: elvish {0}
      run: echo 🎭 Running for a second time, to test caching...

    - uses: ./actions/verify-python-package
      with:
        working-directory: tests/python-lib
        pdm-version: 2.28.0
        check-license: false

    - shell: elvish {0}
      run: echo 🎭 Running for a third time, without passing a specific pdm version...

    - uses: ./actions/verify-python-package
      with:
        working-directory: tests/python-lib
        check-license: false

    - shell: elvish {0}
      run: echo ✅ All tests OK!
